# =========================================
# EcomStore — Example Configuration Template
# =========================================
# Copy this file to application.properties and fill in your real values.
# application.properties should be in .gitignore and NEVER committed with real credentials.

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/EcomStore?createDatabaseIfNotExist=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- JWT ----------
# Use a long, random string (32+ characters) in your real config
jwt.secret=replace_with_a_long_random_secret_key_here
jwt.expiration=86400000

# ---------- Email (Gmail SMTP) ----------
# Requires a Gmail App Password (not your normal password) — see:
# https://myaccount.google.com/apppasswords (needs 2-Step Verification enabled first)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your_16_char_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

admin.notification.email=your-email@gmail.com

# ---------- Airtable ----------
# Personal Access Token from https://airtable.com/create/tokens
# Scopes needed: data.records:write, data.records:read
airtable.api.token=your_airtable_personal_access_token
airtable.base.id=your_airtable_base_id
airtable.table.name=Orders